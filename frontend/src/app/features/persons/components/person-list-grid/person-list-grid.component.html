<div class="overflow-x-auto">
  <table mat-table matSort [dataSource]="dataSource" class="w-full">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        ID
      </th>
      <td mat-cell *matCellDef="let person">
        {{ person.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        ชื่อ
      </th>
      <td mat-cell *matCellDef="let person">
        {{ person.firstName + ' ' + person.lastName}}
      </td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        ที่อยู่
      </th>
      <td mat-cell *matCellDef="let person">
        {{ person.address }}
      </td>
    </ng-container>

    <ng-container matColumnDef="birthDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        วันเกิด
      </th>
      <td mat-cell *matCellDef="let person">
        {{ person.birthDate | date: 'dd/MM/yyyy' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        อายุ
      </th>
      <td mat-cell *matCellDef="let person">
        {{ age(person.birthDate) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>
      </th>
      <td mat-cell *matCellDef="let person">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" (click)="view.emit(person)">
          ดูข้อมูล
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-gray-50">
    </tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="px-4 py-6 text-center text-gray-500" [attr.colspan]="displayedColumns.length">
        No data
      </td>
    </tr>
  </table>
</div>

<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
