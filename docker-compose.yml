services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ttc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SqlServer@123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttc-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ttc-assignment-no1;User Id=sa;Password=SqlServer@123;TrustServerCertificate=True;"
    ports:
      - "7232:8080"
    depends_on:
      - sqlserver
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttc-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
